# CONFIG_SDHC_LOG_LEVEL_DBG=y
# CONFIG_LOG_MODE_IMMEDIATE=y
# CONFIG_SPI_LOG_LEVEL_DBG=y
CONFIG_HWINFO=y
CONFIG_EVENTS=y

CONFIG_FPU=y
# Display
CONFIG_LVGL=y
CONFIG_DISPLAY=y
CONFIG_LV_Z_MEM_POOL_SIZE=38000

CONFIG_ESP32_REGION_1_NOINIT=y

# Stack & Runtime
CONFIG_MAIN_STACK_SIZE=4096

# Misc
CONFIG_I2S=y
CONFIG_I2C=y
CONFIG_RTC=y

# UART
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ESP32=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y